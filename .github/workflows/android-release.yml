name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0). Defaults to run number if empty.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Prepare debug keystore & print SHA-1
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA1:" | sed 's/.*SHA1:[[:space:]]*//')
          echo "Debug signing SHA-1: $SHA1"
          {
            echo "### Android OAuth Signing Info"
            echo "- **Package Name:** \`com.aistudio.synapsedmn.kxmqrp\`"
            echo "- **Debug APK SHA-1:** \`$SHA1\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: 'basic'

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Check Release Keystore secrets
        id: check_signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_release_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Release Keystore & Build Signed Release APK/AAB
        if: steps.check_signing.outputs.has_release_signing == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Determine App Name & Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.release_tag }}"
          else
            RAW_TAG="v1.0.${{ github.run_number }}"
          fi
          SAFE_TAG=$(printf '%s' "$RAW_TAG" | tr '/ ' '--' | tr -cd 'A-Za-z0-9._-')
          APP_NAME=$(sed -n 's/.*<string name="app_name">\([^<]*\)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -n1)
          APP_SLUG=$(printf '%s' "${APP_NAME:-Synapse DMN}" | sed -E 's/[[:space:]]+/-/g' | tr -cd 'A-Za-z0-9._-')
          echo "name=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "safe_tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          echo "app_slug=$APP_SLUG" >> "$GITHUB_OUTPUT"
          echo "app_name=${APP_NAME:-Synapse DMN}" >> "$GITHUB_OUTPUT"

      - name: Collect & rename release artifacts
        env:
          APP_SLUG: ${{ steps.tag.outputs.app_slug }}
          SAFE_TAG: ${{ steps.tag.outputs.safe_tag }}
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob
          for apk in app/build/outputs/apk/debug/*.apk; do
            base=$(basename "$apk")
            suffix="${base#app-}"
            cp "$apk" "release-artifacts/${APP_SLUG}-${SAFE_TAG}-${suffix}"
          done
          if [ -d app/build/outputs/apk/release ]; then
            for apk in app/build/outputs/apk/release/*.apk; do
              base=$(basename "$apk")
              suffix="${base#app-}"
              cp "$apk" "release-artifacts/${APP_SLUG}-${SAFE_TAG}-${suffix}"
            done
          fi
          if [ -d app/build/outputs/bundle/release ]; then
            for aab in app/build/outputs/bundle/release/*.aab; do
              base=$(basename "$aab")
              suffix="${base#app-}"
              cp "$aab" "release-artifacts/${APP_SLUG}-${SAFE_TAG}-${suffix}"
            done
          fi
          rm -f "${{ github.workspace }}/my-upload-key.jks"
          ls -lh release-artifacts/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.app_slug }}-${{ steps.tag.outputs.safe_tag }}-artifacts
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.app_name }} ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: release-artifacts/*
